# Nested SwiftLint config for RawCullTests. SwiftLint merges it with the
# root .swiftlint.yml for files in this folder.
#
# Tests use Swift Testing raw-identifier names, such as
# `Supports openrsync itemized output`(), which start with a capital letter,
# and short locals such as x, y, a, b and i. Both are fine in tests.
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 60
  excluded: ["^id$"]
  validates_start_with_lowercase: off
